---
# One shared environment keeps web, migrate, and the worker on identical
# configuration; a service-specific block is how they silently diverged before.
x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:-}
  POSTGRES_USER: ${POSTGRES_USER:-}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_HOST: ${POSTGRES_HOST:-}
  POSTGRES_PORT: ${POSTGRES_PORT:-}
  DJANGO_ENV: ${DJANGO_ENV:-production}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_SECRET_KEY: >-
    ${DJANGO_SECRET_KEY:-django-insecure-compose-development-key-change-me}
  DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  FEED_REFRESH_LOG_LEVEL: ${FEED_REFRESH_LOG_LEVEL:-INFO}
  AGENT_LINK_SECRET: ${AGENT_LINK_SECRET:-}
  AGENT_LINK_USERNAME: ${AGENT_LINK_USERNAME:-}
  POSTMARK_INBOUND_SECRET: ${POSTMARK_INBOUND_SECRET:-}
  POSTMARK_INBOUND_EMAIL: >-
    ${POSTMARK_INBOUND_EMAIL:-95d8c50c7df8d1ca38d7a6f55ee5a311@inbound.postmarkapp.com}
  LINKDING_TOKEN: ${LINKDING_TOKEN:-}
  LINKDING_URL: ${LINKDING_URL:-https://linkding.reedfish-regulus.ts.net}
  RECOMMENDATION_ARTICLE_LIMIT: ${RECOMMENDATION_ARTICLE_LIMIT:-30}
  RECOMMENDATION_CACHE_SECONDS: ${RECOMMENDATION_CACHE_SECONDS:-900}
  FEED_REFRESH_SECONDS: ${FEED_REFRESH_SECONDS:-3600}
  FEED_FETCH_CONNECT_TIMEOUT_SECONDS: >-
    ${FEED_FETCH_CONNECT_TIMEOUT_SECONDS:-5}
  FEED_FETCH_READ_TIMEOUT_SECONDS: ${FEED_FETCH_READ_TIMEOUT_SECONDS:-20}
  FEED_FETCH_TOTAL_TIMEOUT_SECONDS: ${FEED_FETCH_TOTAL_TIMEOUT_SECONDS:-60}
  FEED_FETCH_MAX_BYTES: ${FEED_FETCH_MAX_BYTES:-5000000}
  FEED_FETCH_MAX_REDIRECTS: ${FEED_FETCH_MAX_REDIRECTS:-3}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-60}
  JOB_MAX_HEARTBEAT_AGE_SECONDS: ${JOB_MAX_HEARTBEAT_AGE_SECONDS:-300}

services:
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Schema changes run once, to completion, before anything serves or refreshes.
  # A failed migration therefore stops the deployment instead of leaving mixed
  # code and schema behind a live listener.
  migrate:
    restart: "no"
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  web:
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    build: .
    command:
      - gunicorn
      - daily_firehose.wsgi:application
      - --bind
      - 0.0.0.0:8000
    environment: *app-environment
    ports:
      # Gunicorn listens on all container interfaces; Docker publishes loopback.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py", "/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  refresh-feeds:
    restart: unless-stopped
    init: true
    # The worker finishes the Feed in flight, records the interrupted cycle, and
    # releases its lock before exiting.
    stop_grace_period: 120s
    build: .
    command: ["python", "manage.py", "run_refresh_worker"]
    environment: *app-environment
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_refresh_worker"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 900s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_healthy

volumes:
  postgres-data:
