---
services:
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    restart: unless-stopped
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn daily_firehose.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-}
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: >-
        ${DJANGO_SECRET_KEY:-django-insecure-compose-development-key-change-me}
      AGENT_LINK_SECRET: ${AGENT_LINK_SECRET:-}
      AGENT_LINK_USERNAME: ${AGENT_LINK_USERNAME:-}
      POSTMARK_INBOUND_SECRET: ${POSTMARK_INBOUND_SECRET:-}
      POSTMARK_INBOUND_EMAIL: >-
        ${POSTMARK_INBOUND_EMAIL:-95d8c50c7df8d1ca38d7a6f55ee5a311@inbound.postmarkapp.com}
      LINKDING_TOKEN: ${LINKDING_TOKEN:-}
      LINKDING_URL: ${LINKDING_URL:-https://linkding.reedfish-regulus.ts.net}
      FEED_FETCH_CONNECT_TIMEOUT_SECONDS: >-
        ${FEED_FETCH_CONNECT_TIMEOUT_SECONDS:-5}
      FEED_FETCH_READ_TIMEOUT_SECONDS: ${FEED_FETCH_READ_TIMEOUT_SECONDS:-20}
      FEED_FETCH_TOTAL_TIMEOUT_SECONDS: ${FEED_FETCH_TOTAL_TIMEOUT_SECONDS:-60}
      FEED_FETCH_MAX_BYTES: ${FEED_FETCH_MAX_BYTES:-5000000}
      FEED_FETCH_MAX_REDIRECTS: ${FEED_FETCH_MAX_REDIRECTS:-3}
    ports:
      # Gunicorn listens on all container interfaces; Docker publishes loopback.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(('127.0.0.1', 8000), timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  refresh-feeds:
    restart: unless-stopped
    build: .
    command: >
      sh -c "while true; do
               python manage.py refresh_feeds;
               sleep $${FEED_REFRESH_SECONDS:-3600};
             done"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-}
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: >-
        ${DJANGO_SECRET_KEY:-django-insecure-compose-development-key-change-me}
      FEED_REFRESH_SECONDS: ${FEED_REFRESH_SECONDS:-3600}
      FEED_FETCH_CONNECT_TIMEOUT_SECONDS: >-
        ${FEED_FETCH_CONNECT_TIMEOUT_SECONDS:-5}
      FEED_FETCH_READ_TIMEOUT_SECONDS: ${FEED_FETCH_READ_TIMEOUT_SECONDS:-20}
      FEED_FETCH_TOTAL_TIMEOUT_SECONDS: ${FEED_FETCH_TOTAL_TIMEOUT_SECONDS:-60}
      FEED_FETCH_MAX_BYTES: ${FEED_FETCH_MAX_BYTES:-5000000}
      FEED_FETCH_MAX_REDIRECTS: ${FEED_FETCH_MAX_REDIRECTS:-3}
      AGENT_LINK_SECRET: ${AGENT_LINK_SECRET:-}
      AGENT_LINK_USERNAME: ${AGENT_LINK_USERNAME:-}
      LINKDING_TOKEN: ${LINKDING_TOKEN:-}
      LINKDING_URL: ${LINKDING_URL:-https://linkding.reedfish-regulus.ts.net}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:
