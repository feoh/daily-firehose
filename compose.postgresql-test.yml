---
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daily_firehose_test_lane
      POSTGRES_USER: daily_firehose_test_lane
      POSTGRES_PASSWORD: daily_firehose_test_lane_password
    ports:
      # An ephemeral loopback port avoids collisions with other databases.
      - "127.0.0.1::5432"
    tmpfs:
      # The integration lane is disposable and never uses a durable volume.
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U daily_firehose_test_lane -d daily_firehose_test_lane
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 5s
